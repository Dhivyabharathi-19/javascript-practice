<!-- Change Border Style

Create a <div> with some content.
Write JS to change its border to 2px dashed red when a button is clicked. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Change Border Style</title>
  </head>
  <body>
    <div
      id="myBox"
      style="
        width: 200px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
      "
    >
      This is a box.
    </div>
    <br />
    <br />
    <button onclick="changeBorder()">Change Border</button>

    <script>
      function changeBorder() {
        const box = document.getElementById("myBox");
        box.style.border = "2px dashed red";
      }
    </script>
  </body>
</html>

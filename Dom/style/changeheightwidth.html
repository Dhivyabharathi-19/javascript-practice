<!-- 5. Change Width and Height

Create a <div> with a fixed size.
Write JS to increase its width to 300px and height to 150px when a button is clicked. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>change Height and Width</title>
  </head>
  <body>
    <p id="height" style="height: 50px; width: 100px; border: dashed">
      Lorem, ipsum
    </p>
    <button onclick="changeHeight()">Change Height</button>
    <script>
      function changeHeight() {
        document.getElementById("height").style.height = "250px";
        document.getElementById("height").style.width = "300px";
      }
    </script>
  </body>
</html>

<!-- Create a button and a paragraph.  -->
<!-- When you click the button, change the
paragraph text to "Hello JavaScript!". -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Text</title>
  </head>
  <body>
    <p id="Text">Hello HTML!</p>
    <button
      onclick="changeText()"
      style="background-color: blanchedalmond; border: none"
    >
      Click Me
    </button>
  </body>
  <script>
    function changeText() {
      document.getElementById("Text").innerHTML = "Hello JavaScript!";
    }
  </script>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Event</title>
  </head>
  <body>
    <p id="para"></p>
    <button id="btn">Click Me</button>

    <script>
      const btnpress = document.getElementById("btn");

      btnpress.addEventListener("dblclick", function () {
        console.log("clicked");

        document.getElementById("para").textContent = "welcome";
      });
    </script>
  </body>
</html>

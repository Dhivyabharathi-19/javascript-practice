<!-- 1. Fetch and Print Data // Use JavaScript to fetch data from //
https://jsonplaceholder.typicode.com/posts // and print the result in the
console. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fetch API</title>
  </head>
  <body>
    <h2>Open Console to See Output</h2>

    <script>
      fetch("https://jsonplaceholder.typicode.com/posts/1")
        .then((response) => response.json())
        .then((data) => {
          console.log(data);
        })
        .catch((error) => {
          console.log("Error:", error);
        });
    </script>
  </body>
</html>

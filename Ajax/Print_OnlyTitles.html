<!-- Print Only Titles

 Fetch posts from the API and print only the title of each post. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Titles</title>
  </head>
  <body>
    <h2>Post Titles</h2>
    <button onclick="loadTitles()">Load Titles</button>

    <ul id="titles"></ul>

    <script>
      function loadTitles() {
        fetch("https://jsonplaceholder.typicode.com/posts")
          .then((response) => response.json())
          .then((data) => {
            let list = document.getElementById("titles");
            list.innerHTML = "";

            data.forEach((post) => {
              let li = document.createElement("li");
              li.textContent = post.title;
              list.appendChild(li);
            });
          });
      }
    </script>
  </body>
</html>

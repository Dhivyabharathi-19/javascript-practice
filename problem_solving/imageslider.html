<!-- 5️⃣ Image Slider (Basic)

Task:

Show images one by one

Next / Previous buttons

Images stored in array

Checks:

Array index logic

Event handling

DOM updates -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <style>
      img {
        width: 300px;
        height: 400px;
        object-fit: cover;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Image Slider</h2>

    <img id="slider" />
    <br />
    <button onclick="prev()">Previous</button>
    <button onclick="next()">Next</button>

    <script>
      const images = [
        "https://i.pinimg.com/736x/da/1c/97/da1c97e6100e17a9e4bdf5a2b2e1c043.jpg",
        "https://i.pinimg.com/236x/5d/b1/fd/5db1fd2f28f19678251d3baea24703b6.jpg",
        "https://m.media-amazon.com/images/I/61KTJrjIVuL._AC_UF1000,1000_QL80_.jpg",
      ];

      let index = 0;
      const img = document.getElementById("slider");
      img.src = images[index];
      function next() {
        index++;
        if (index === images.length) {
          index = 0;
        }
        img.src = images[index];
      }

      function prev() {
        index--;
        if (index < 0) {
          index = images.length - 1;
        }
        img.src = images[index];
      }
    </script>
  </body>
</html>
